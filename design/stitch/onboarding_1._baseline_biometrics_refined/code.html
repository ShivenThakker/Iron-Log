ton"><span class="material-symbols-outlined text-[18px]">remove</span></button><button aria-label="Increase height" class="w-10 h-10 rounded-lg bg-surface-container hover:bg-surface-bright flex items-center justify-center text-on-surface active:scale-90 transition-transform" onclick="adjustValue('height-input', 1)" type="button"><span class="material-symbols-outlined text-[18px]">add</span></button></div></div></div><div class="flex flex-col gap-space-xs p-space-md rounded-xl bg-surface-container-low border border-surface-container shadow-sm"><div class="flex items-center justify-between"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Current Weight</span><div class="flex rounded-md bg-surface-container-lowest p-0.5"><button class="px-2.5 py-0.5 rounded text-[10px] font-label-caps uppercase bg-primary-container text-on-primary-fixed" id="weight-unit-kg" onclick="setWeightUnit('kg')" type="button">kg</button><button class="px-2.5 py-0.5 rounded text-[10px] font-label-caps uppercase text-on-surface-variant" id="weight-unit-lbs" onclick="setWeightUnit('lbs')" type="button">lbs</button></div></div><div class="flex items-center justify-between mt-space-sm"><button aria-label="Decrease weight" class="w-12 h-12 rounded-xl bg-surface-container hover:bg-surface-bright flex items-center justify-center text-on-surface active:scale-95 transition-transform" onclick="adjustWeight(-0.5)" type="button"><span class="material-symbols-outlined text-[20px]">remove</span></button><div class="flex items-baseline gap-space-xs"><span class="font-display-hero-mobile text-display-hero-mobile text-on-surface font-bold tracking-tight" id="weight-display">78.0</span><span class="font-label-interactive text-label-interactive text-primary-container font-bold" id="weight-unit-display">kg</span></div><button aria-label="Increase weight" class="w-12 h-12 rounded-xl bg-surface-container hover:bg-surface-bright flex items-center justify-center text-on-surface active:scale-95 transition-transform" onclick="adjustWeight(0.5)" type="button"><span class="material-symbols-outlined text-[20px]">add</span></button></div></div></form></div>
<script>
  let currentWeight = 78.0;
  let weightUnit = 'kg';
  let heightUnit = 'cm';

  function selectSex(selected) {
    const options = ['male', 'female', 'other'];
    options.forEach(opt => {
      const el = document.getElementById('sex-' + opt);
      if (opt === selected) {
        el.className = 'h-12 rounded-lg font-label-interactive text-label-interactive flex items-center justify-center transition-all bg-surface-container-high text-primary-container shadow-sm';
      } else {
        el.className = 'h-12 rounded-lg font-label-interactive text-label-interactive flex items-center justify-center transition-all text-on-surface-variant hover:text-on-surface';
      }
    });
  }

  function adjustValue(inputId, delta) {
    const input = document.getElementById(inputId);
    let val = parseInt(input.value, 10) || 0;
    val = Math.max(1, val + delta);
    input.value = val;
  }

  function adjustWeight(delta) {
    currentWeight = Math.max(20, Math.round((currentWeight + delta) * 10) / 10);
    document.getElementById('weight-display').innerText = currentWeight.toFixed(1);
  }

  function setHeightUnit(unit) {
    heightUnit = unit;
    const cmBtn = document.getElementById('height-unit-cm');
    const ftBtn = document.getElementById('height-unit-ft');
    const label = document.getElementById('height-unit-label');
    const input = document.getElementById('height-input');

    if (unit === 'cm') {
      cmBtn.className = 'px-1.5 py-0.5 rounded text-[10px] font-label-caps uppercase bg-primary-container text-on-primary-fixed';
      ftBtn.className = 'px-1.5 py-0.5 rounded text-[10px] font-label-caps uppercase text-on-surface-variant';
      label.innerText = 'cm';
      input.value = '178';
    } else {
      ftBtn.className = 'px-1.5 py-0.5 rounded text-[10px] font-label-caps uppercase bg-primary-container text-on-primary-fixed';
      cmBtn.className = 'px-1.5 py-0.5 rounded text-[10px] font-label-caps uppercase text-on-surface-variant';
      label.innerText = 'ft.in';
      input.value = '5.10';
    }
  }

  function setWeightUnit(unit) {
    weightUnit = unit;
    const kgBtn = document.getElementById('weight-unit-kg');
    const lbsBtn = document.getElementById('weight-unit-lbs');
    const displayUnit = document.getElementById('weight-unit-display');

    if (unit === 'kg') {
      kgBtn.className = 'px-2 py-0.5 rounded text-[10px] font-label-caps uppercase bg-primary-container text-on-primary-fixed';
      lbsBtn.className = 'px-2 py-0.5 rounded text-[10px] font-label-caps uppercase text-on-surface-variant';
      displayUnit.innerText = 'kg';
      currentWeight = 78.0;
    } else {
      lbsBtn.className = 'px-2 py-0.5 rounded text-[10px] font-label-caps uppercase bg-primary-container text-on-primary-fixed';
      kgBtn.className = 'px-2 py-0.5 rounded text-[10px] font-label-caps uppercase text-on-surface-variant';
      displayUnit.innerText = 'lbs';
      currentWeight = 172.0;
    }
    document.getElementById('weight-display').innerText = currentWeight.toFixed(1);
  }
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,0,0,0.3)]"><div class="px-margin py-space-sm flex flex-col items-center"><button class="w-full h-14 rounded-lg bg-primary-container text-on-primary-fixed font-label-interactive text-label-interactive uppercase tracking-wider flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform" type="button"><span>Continue</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></footer></body></html>
