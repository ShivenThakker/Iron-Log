on-transform" type="button">Hamstrings</button><button class="muscle-pill h-8 px-space-md rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface font-label-interactive text-body-sm active:scale-95 transition-transform" type="button">Glutes</button></div></section>

<section class="flex flex-col gap-space-sm bg-surface-container-low p-space-md rounded-xl"><div class="flex items-center justify-between"><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px] text-on-surface-variant">health_and_safety</span><label class="font-label-caps text-label-caps uppercase text-on-surface-variant tracking-wider">Joint Cautions</label></div><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Protection</span></div><div class="flex flex-wrap gap-2" id="joint-group"><button class="joint-pill is-active h-8 px-space-md rounded-lg bg-surface-container text-primary-container border border-primary-container/40 font-label-interactive text-body-sm flex items-center gap-1.5 active:scale-95 transition-transform" type="button"><span class="material-symbols-outlined text-[14px]">shield</span><span class="">None</span></button><button class="joint-pill h-8 px-space-md rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface font-label-interactive text-body-sm active:scale-95 transition-transform" type="button"><span class="">Shoulders</span></button><button class="joint-pill h-8 px-space-md rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface font-label-interactive text-body-sm active:scale-95 transition-transform" type="button"><span class="">Lower Back</span></button><button class="joint-pill h-8 px-space-md rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface font-label-interactive text-body-sm active:scale-95 transition-transform" type="button"><span class="">Knees</span></button></div></section>
<!-- Realtime Routine Summary Banner -->
</div>
<script>
  // Micro-interaction handlers for interactive onboarding state
  document.querySelectorAll('.freq-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.freq-btn').forEach(b => {
        b.classList.remove('bg-primary-container', 'text-on-primary-fixed', 'shadow-md', 'is-active');
        b.classList.add('bg-surface-container-high', 'text-on-surface');
      });
      btn.classList.add('bg-primary-container', 'text-on-primary-fixed', 'shadow-md', 'is-active');
      btn.classList.remove('bg-surface-container-high', 'text-on-surface');
      
      const days = btn.dataset.days;
      const split = btn.dataset.split;
      const note = document.getElementById('split-indicator');
      if (note) {
        note.textContent = `${days} days selected • ${split}`;
      }
    });
  });

  document.querySelectorAll('.equip-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const icon = chip.querySelector('.material-symbols-outlined');
      if (chip.classList.contains('is-active')) {
        chip.classList.remove('is-active', 'bg-primary-container', 'text-on-primary-fixed');
        chip.classList.add('bg-surface-container-high', 'text-on-surface-variant');
        if (icon) icon.textContent = 'add';
      } else {
        chip.classList.add('is-active', 'bg-primary-container', 'text-on-primary-fixed');
        chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        if (icon) icon.textContent = 'check';
      }
      const count = document.querySelectorAll('.equip-chip.is-active').length;
      const counter = document.getElementById('equip-count');
      if (counter) counter.textContent = `${count} Active`;
    });
  });

  document.querySelectorAll('.muscle-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      if (pill.classList.contains('is-active')) {
        pill.classList.remove('is-active', 'bg-primary-container', 'text-on-primary-fixed');
        pill.classList.add('bg-surface-container', 'text-on-surface-variant');
      } else {
        pill.classList.add('is-active', 'bg-primary-container', 'text-on-primary-fixed');
        pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
      }
    });
  });

  document.querySelectorAll('.joint-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const isNone = pill.textContent.includes('None Selected');
      if (isNone) {
        document.querySelectorAll('.joint-pill').forEach(p => {
          p.classList.remove('is-active', 'bg-secondary-fixed', 'text-on-secondary-fixed');
          p.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        pill.classList.add('is-active', 'bg-secondary-fixed', 'text-on-secondary-fixed');
        pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
      } else {
        const nonePill = document.querySelector('.joint-pill:first-child');
        if (nonePill) {
          nonePill.classList.remove('is-active', 'bg-secondary-fixed', 'text-on-secondary-fixed');
          nonePill.classList.add('bg-surface-container', 'text-on-surface-variant');
        }
        pill.classList.toggle('is-active');
        if (pill.classList.contains('is-active')) {
          pill.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
          pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
        } else {
          pill.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
          pill.classList.add('bg-surface-container', 'text-on-surface-variant');
        }
      }
    });
  });

  document.querySelectorAll('.split-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.split-pill').forEach(p => {
        p.classList.remove('bg-primary-container', 'text-on-primary-fixed');
        p.classList.add('bg-surface-container', 'text-on-surface-variant');
        const icon = p.querySelector('.material-symbols-outlined');
        if (icon) icon.remove();
      });
      pill.classList.add('bg-primary-container', 'text-on-primary-fixed');
      pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
      if (!pill.querySelector('.material-symbols-outlined')) {
        const check = document.createElement('span');
        check.className = 'material-symbols-outlined text-[16px] mr-1.5';
        check.textContent = 'check';
        pill.prepend(check);
      }
    });
  });
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,0,0,0.3)]"><div class="px-margin py-space-sm flex flex-col items-center"><button class="w-full h-14 rounded-lg bg-primary-container text-on-primary-fixed font-label-interactive text-label-interactive uppercase tracking-wider flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform" type="button"><span class="">Continue</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></footer>
