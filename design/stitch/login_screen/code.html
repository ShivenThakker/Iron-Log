 "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-fixed"><main class="flex flex-col flex-1 relative w-full bg-surface px-margin"><div class="flex flex-col w-full justify-between items-center px-margin py-space-xl" style="min-height: calc(100vh - 4rem);">

</div>
<div class="flex flex-col items-center justify-center text-center my-auto px-space-md w-full max-w-xs">
<div class="relative flex items-center justify-center mb-space-lg group">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center shadow-xl relative z-10 transition-transform duration-300 group-hover:scale-105">
<span class="material-symbols-outlined text-[32px] text-primary-fixed" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div class="absolute -inset-1 rounded-2xl bg-primary-fixed opacity-20 blur-md pointer-events-none"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-wider uppercase text-on-surface mb-space-xs font-bold">
      IronLog
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant tracking-normal">
      Your AI Fitness Companion
    </p>

</div>
<div class="w-full flex flex-col items-center space-y-space-sm max-w-sm">
<button class="w-full h-14 bg-primary-fixed text-on-primary-fixed font-label-interactive text-label-interactive rounded-xl flex items-center justify-center transition-all duration-150 active:scale-[0.98] shadow-md hover:bg-primary-fixed-dim" id="btn-get-started">
      Get Started
    </button>
<button class="w-full h-14 bg-surface-container text-on-surface font-label-interactive text-label-interactive rounded-xl flex items-center justify-center transition-all duration-150 active:scale-[0.98] hover:bg-surface-container-high" id="btn-login">
      I already have an account
    </button>
<div class="pt-space-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">
        By continuing, you accept our 
        <a class="underline underline-offset-2 hover:text-on-surface transition-colors" href="#terms">Terms</a> 
        &amp; 
        <a class="underline underline-offset-2 hover:text-on-surface transition-colors" href="#privacy">Privacy</a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const getStartedBtn = document.getElementById('btn-get-started');
    const loginBtn = document.getElementById('btn-login');

    if (getStartedBtn) {
      getStartedBtn.addEventListener('click', () => {
        getStartedBtn.classList.add('opacity-90');
        setTimeout(() => getStartedBtn.classList.remove('opacity-90'), 150);
      });
    }

    if (loginBtn) {
      loginBtn.addEventListener('click', () => {
        loginBtn.classList.add('opacity-80');
        setTimeout(() => loginBtn.classList.remove('opacity-80'), 150);
      });
    }
  })();
</script></main>
