<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#10131c;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#363943", "on-surface": "#e0e2ef", "error-container": "#93000a", "on-tertiary-fixed": "#410008", "outline": "#8e9379", "inverse-surface": "#e0e2ef", "on-primary-container": "#556d00", "surface-container-low": "#181b25", "tertiary": "#ffffff", "on-tertiary": "#680013", "on-error-container": "#ffdad6", "background": "#10131c", "surface-tint": "#abd600", "primary": "#ffffff", "primary-fixed": "#c3f400", "inverse-on-surface": "#2d303a", "on-primary-fixed": "#161e00", "outline-variant": "#444933", "tertiary-container": "#ffdad9", "primary-fixed-dim": "#abd600", "surface": "#10131c", "surface-container": "#1c1f29", "on-secondary": "#00363d", "secondary": "#bdf4ff", "on-primary": "#283500", "surface-variant": "#32343e", "surface-container-highest": "#32343e", "on-secondary-container": "#00616d", "secondary-container": "#00e3fd", "secondary-fixed": "#9cf0ff", "on-tertiary-container": "#c61732", "on-background": "#e0e2ef", "on-tertiary-fixed-variant": "#92001f", "on-surface-variant": "#c4c9ac", "error": "#ffb4ab", "tertiary-fixed-dim": "#ffb3b2", "inverse-primary": "#506600", "on-secondary-fixed": "#001f24", "tertiary-fixed": "#ffdad9", "on-error": "#690005", "primary-container": "#c3f400", "secondary-fixed-dim": "#00daf3", "on-secondary-fixed-variant": "#004f58", "surface-dim": "#10131c", "surface-container-high": "#272a33", "o </head><body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-fixed"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><div class="flex-1 flex flex-col items-center gap-1.5 px-space-xs"><div class="flex items-center gap-space-xs"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant tracking-wider">Step 2 of 4</span></div><div class="w-full max-w-[140px] h-1 bg-surface-container rounded-full overflow-hidden"><div class="h-full bg-primary-container rounded-full transition-all duration-300 w-2/4"></div></div></div><div class="flex items-center gap-space-xs"><button class="h-11 px-space-sm flex items-center justify-center font-label-interactive text-label-interactive text-on-surface-variant hover:text-primary-container transition-colors" type="button">Skip</button></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-28 bg-surface"><div class="flex flex-col w-full gap-space-lg"><!-- Header Title Block --><div class="flex flex-col gap-space-xs pt-space-xs"><div class="flex items-center gap-space-xs"><span class="font-label-caps text-label-caps text-primary-container uppercase tracking-wider font-semibold">Goals &amp; Experience</span></div><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight font-bold">What’s your goal?</h1><p class="font-body-md text-body-md text-on-surface-variant">Select your primary fitness objective to calibrate your training and nutrition targets.</p></div><!-- Section 1: Primary Goal --><div class="flex flex-col gap-space-sm"><div class="flex items-center justify-between"><span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">01 • Primary Goal</span><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Single Select</span></div><div class="flex flex-col gap-space-xs" id="goal-selector"><button class="goal-option text-left w-full p-space-sm rounded-lg bg-surface-container border border-surface-container-highest hover:bg-surface-container-high active:scale-[0.99] transition-all flex items-center gap-space-sm" data-goal="muscle" type="button"><div class="w-11 h-11 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 text-on-surface-variant"><span class="material-symbols-outlined text-[22px]">fitness_center</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Build Muscle</span><div class="radio-pill w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center"><div class="dot w-2 h-2 rounded-full bg-transparent"></div></div></div><p class="font-body-sm text-body-sm text-on-surface-variant truncate">Hypertrophy &amp; muscle mass development</p></div></button><button class="goal-option text-left w-full p-space-sm rounded-lg bg-surface-container-high border-2 border-primary-container shadow-md active:scale-[0.99] transition-all flex items-center gap-space-sm" data-goal="fat-loss" type="button"><div class="w-11 h-11 rounded-lg bg-primary-container text-on-primary-fixed flex items-center justify-center shrink-0 shadow-sm"><span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="font-headline-sm text-headline-sm text-on-surface font-bold">Lose Fat</span><div class="radio-pill w-5 h-5 rounded-full bg-primary-container flex items-center justify-center shadow-[0_0_10px_rgba(195,244,0,0.5)]"><span class="material-symbols-outlined text-on-primary-fixed text-[16px] font-bold">check</span></div></div><p class="font-body-sm text-body-sm text-on-surface-variant truncate">Caloric deficit with lean muscle preservation</p></div></button><button class="goal-option text-left w-full p-space-sm rounded-lg bg-surface-container border border-surface-container-highest hover:bg-surface-container-high active:scale-[0.99] transition-all flex items-center gap-space-sm" data-goal="strength" type="button"><div class="w-11 h-11 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 text-on-surface-variant"><span class="material-symbols-outlined text-[22px]">trophy</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Get Stronger</span><div class="radio-pill w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center"><div class="dot w-2 h-2 rounded-full bg-transparent"></div></div></div><p class="font-body-sm text-body-sm text-on-surface-variant truncate">Heavy compound strength &amp; 1RM progression</p></div></button><button class="goal-option text-left w-full p-space-sm rounded-lg bg-surface-container border border-surface-container-highest hover:bg-surface-container-high active:scale-[0.99] transition-all flex items-center gap-space-sm" data-goal="conditioning" type="button"><div class="w-11 h-11 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 text-on-surface-variant"><span class="material-symbols-outlined text-[22px]">bolt</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Athletic Conditioning</span><div class="radio-pill w-5 h-5 rounded-full border border-outline-variant flex items-center justify-center"><div class="dot w-2 h-2 rounded-full bg-transparent"></div></div></div><p class="font-body-sm text-body-sm text-on-surface-variant truncate">Work capacity, functional stamina &amp; agility</p></div></button></div></div><!-- Section 2: Target Weight --><div class="flex flex-col gap-space-sm"><div class="flex items-center justify-between"><span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">02 • Target Weight</span><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current: 78 kg</span></div><div class="p-space-md rounded-lg bg-surface-container border border-surface-container-highest flex flex-col gap-space-md"><div class="flex items-center justify-between"><div class="flex flex-col"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Target Bodyweight</span><div class="flex items-baseline gap-1.5 pt-0.5"><span class="font-metric-numeral text-metric-numeral text-on-surface font-bold tracking-tight" id="target-value">75</span><span class="font-headline-sm text-headline-sm text-on-surface-variant">kg</span></div></div><div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-secondary-container/20 text-secondary-container font-label-interactive text-label-interactive"><span class="material-symbols-outlined text-[16px]">trending_down</span><span id="delta-indicator" class="">-3 kg from current</span></div></div><div class="flex items-center gap-space-sm"><button aria-label="Decrease weight" class="flex-1 h-12 rounded-lg bg-surface-container-highest hover:bg-surface-bright active:scale-95 transition-all text-on-surface flex items-center justify-center" id="btn-dec" type="button"><span class="material-symbols-outlined text-[22px]">remove</span></button><button aria-label="Increase weight" class="flex-1 h-12 rounded-lg bg-surface-container-highest hover:bg-surface-bright active:scale-95 transition-all text-on-surface flex items-center justify-center" id="btn-inc" type="button"><span class="material-symbols-outlined text-[22px]">add</span></button></div></div></div><!-- Section 3: Lifting Experience --><div class="flex flex-col gap-space-sm"><div class="flex items-center justify-between"><span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">03 • Experience Level</span><span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Training Age</span></div><div class="grid grid-cols-3 p-1 rounded-lg bg-surface-container border border-surface-container-highest gap-1" id="experience-segmented"><button class="exp-tab flex flex-col items-center justify-center py-2.5 px-1 rounded-lg text-center transition-all hover:bg-surface-container-high" data-exp="beginner" type="button"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant font-semibold">Beginner</span><span class="font-body-sm text-body-sm text-on-surface-variant">&lt; 6 mo</span></button><button class="exp-tab flex flex-col items-center justify-center py-2.5 px-1 rounded-lg text-center bg-primary-container text-on-primary-fixed shadow-sm transition-all" data-exp="intermediate" type="button"><span class="font-label-caps text-label-caps uppercase text-on-primary-fixed font-bold">Intermediate</span><span class="font-body-sm text-body-sm text-on-primary-fixed font-semibold">1–3 yrs</span></button><button class="exp-tab flex flex-col items-center justify-center py-2.5 px-1 rounded-lg text-center transition-all hover:bg-surface-container-high" data-exp="advanced" type="button"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant font-semibold">Advanced</span><span class="font-body-sm text-body-sm text-on-surface-variant">3+ yrs</span></button></div></div></div>
<script>
  (function() {
    // Goal Selection Interactive Logic
    const goalButtons = document.querySelectorAll('.goal-option');
    goalButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        goalButtons.forEach(b => {
          b.classList.remove('bg-surface-container-high', 'shadow-md');
          b.classList.add('bg-surface-container');
          const iconBox = b.querySelector('div:first-child');
          iconBox.classList.remove('bg-primary-container', 'text-on-primary-fixed', 'shadow-sm');
          iconBox.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
          const radioPill = b.querySelector('.radio-pill');
          radioPill.className = 'radio-pill w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center';
          const dot = radioPill.querySelector('.dot');
          dot.className = 'dot w-2 h-2 rounded-full bg-transparent';
          const badge = b.querySelector('.text-primary-container.uppercase');
          if (badge) badge.remove();
        });

        btn.classList.remove('bg-surface-container');
        btn.classList.add('bg-surface-container-high', 'shadow-md');
        const iconBox = btn.querySelector('div:first-child');
        iconBox.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
        iconBox.classList.add('bg-primary-container', 'text-on-primary-fixed', 'shadow-sm');
        
        const radioPill = btn.querySelector('.radio-pill');
        radioPill.className = 'radio-pill w-5 h-5 rounded-full bg-primary-container flex items-center justify-center shadow-[0_0_10px_rgba(195,244,0,0.5)]';
        const dot = radioPill.querySelector('.dot');
        dot.className = 'dot w-2 h-2 rounded-full bg-on-primary-fixed';
      });
    });

    // Weight Stepper Logic
    let currentWeight = 78;
    let targetWeight = 75;
    const targetValEl = document.getElementById('target-value');
    const deltaEl = document.getElementById('delta-indicator');
    const btnInc = document.getElementById('btn-inc');
    const btnDec = document.getElementById('btn-dec');

    function updateWeight() {
      if (!targetValEl || !deltaEl) return;
      targetValEl.textContent = targetWeight;
      const diff = targetWeight - currentWeight;
      if (diff < 0) {
        deltaEl.textContent = `${diff} kg from current`;
      } else if (diff === 0) {
        deltaEl.textContent = `Maintain baseline`;
      } else {
        deltaEl.textContent = `+${diff} kg from current`;
      }
    }

    if (btnInc && btnDec) {
      btnInc.addEventListener('click', () => {
        if (targetWeight < 150) {
          targetWeight += 1;
          updateWeight();
        }
      });
      btnDec.addEventListener('click', () => {
        if (targetWeight > 40) {
          targetWeight -= 1;
          updateWeight();
        }
      });
    }

    // Experience Segmented Selector
    const expTabs = document.querySelectorAll('.exp-tab');
    expTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        expTabs.forEach(t => {
          t.classList.remove('bg-surface-container-highest', 'shadow-sm');
          const title = t.querySelector('span:first-child');
          const sub = t.querySelector('span:last-child');
          title.className = 'font-label-caps text-label-caps uppercase text-on-surface-variant';
          sub.className = 'font-body-sm text-body-sm text-on-surface-variant';
        });

        tab.classList.add('bg-surface-container-highest', 'shadow-sm');
        const activeTitle = tab.querySelector('span:first-child');
        const activeSub = tab.querySelector('span:last-child');
        activeTitle.className = 'font-label-caps text-label-caps uppercase text-primary-container font-semibold';
        activeSub.className = 'font-body-sm text-body-sm text-on-surface font-semibold';
      });
    });
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,0,0,0.3)]"><div class="px-margin py-space-sm flex flex-col items-center"><button class="w-full h-14 rounded-lg bg-primary-container text-on-primary-fixed font-label-interactive text-label-interactive uppercase tracking-wider flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform" type="button"><span class="">Continue</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></footer>
