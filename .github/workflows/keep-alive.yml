name: Render Keep-Alive Ping

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping IronLog Health Endpoint
        run: |
          echo "Pinging IronLog API to prevent Render spin-down..."
          curl -sS --max-time 90 --retry 3 --retry-delay 5 https://ironlog-api-3ljb.onrender.com/health || echo "Ping failed"
